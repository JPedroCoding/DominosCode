<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="garcom_pedidos.css">
  <title>Painel do Garçom</title>
</head>

<body>

  <main class="conteudo-principal-fixo">

    <header class="navbar">
      <div class="header-left">
        <div class="logo-badge">
          <div class="logo-icon">🍕</div>
          <div class="title-area">
            <h1>Domino's Pizza</h1>
            <p class="mp">Painel do Garçom</p>
          </div>
        </div>
      </div>
      <div class="actions-section">
        <a href="index.html" class="logout-btn">Sair</a>
      </div>
    </header>

    <div class="centralizador">
      <div class="dashboard-cards">

        <div class="container-mesas">
          <p>Total de Mesas</p>
          <h2>5</h2>
          <div class="icon">
            <img src="./assets/pessoa azul.png" width="50" alt="Logo Mesas Azul">
          </div>
        </div>

        <div class="container-mesas-ocupadas">
          <p>Mesas Ocupadas</p>
          <h2>0</h2>
          <div class="icon">
            <img src="./assets/pessoa laranja.png" alt="Logo Mesas Ocupadas Laranja" width="60">
          </div>
        </div>

        <div class="container-mesas-pagamento">
          <p>Aguardando
          <p>Pagamento</p>
          </p>
          <h2>0</h2>
          <div class="icon">
            <img src="./assets/logo pagamento vermelho.png" alt="Logo Pagamento Vermelho" width="50">
          </div>
        </div>

        <div class="container-mesas-pedidos">
          <p>Pedidos Ativos</p>
          <h2>0</h2>
          <div class="icon">
            <img src="./assets/relogio verde.png" alt="">
          </div>
        </div>
      </div>

      <div class="secao-mesas">

        <div class="abas-navegacao">
          <a href="garcom_mesas.html" class="aba-mesas">Mesas</a>
          <a href="garcom_pedidos.html" class="aba-pedidos">Pedidos</a>
        </div>

        <div class="pedidos-recentes">
          <h2>Pedidos Recentes</h2>
          <p>Pedidos em Andamento</p>

          <div class="pedidos-vazios">
            <h2>Nenhum pedido em andamento</h2>

          </div>
        </div>
  </main>

</body>

</html>
